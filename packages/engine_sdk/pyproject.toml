[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-sdk"
version = "1.0.0"
description = "AI Voice Studio — Engine Adapter SDK"
authors = [{ name = "AI Voice Studio Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
